ermission or agreement for something", "e": "Users must give explicit consent before their personal data is collected.", "ec": "在收集个人数据之前，用户必须给予明确同意。", "t": "law", "d": "2026-07-13"}, {"w": "governance", "p": "/ˈɡʌvərnəns/", "mc": "n. 治理，管理", "me": "the system of rules and processes by which an organization is directed", "e": "Good data governance requires clear policies and accountability.", "ec": "良好的数据治理需要清晰的政策和问责机制。", "t": "law", "d": "2026-07-13"}, {"w": "enforcement", "p": "/ɪnˈfɔrsmənt/", "mc": "n. 执行，实施", "me": "the act of compelling observance of a law", "e": "Regulatory enforcement actions have increased significantly this year.", "ec": "今年监管执法行动显著增加。", "t": "law", "d": "2026-07-13"}, {"w": "stakeholder", "p": "/ˈsteɪkholdər/", "mc": "n. 利益相关方", "me": "a person or group with an interest in a business", "e": "All stakeholders should be consulted before implementing a new data policy.", "ec": "在实施新数据政策之前，应咨询所有利益相关方。", "t": "biz", "d": "2026-07-13"}, {"w": "acquisition", "p": "/ækwɪˈzɪʃn/", "mc": "n. 收购，并购", "me": "the purchase of one company by another", "e": "The acquisition of the tech startup was valued at $500 million.", "ec": "对该科技初创公司的收购估值为5亿美元。", "t": "biz", "d": "2026-07-13"}, {"w": "revenue", "p": "/ˈrevənju/", "mc": "n. 收入，营收", "me": "income generated from business activities", "e": "Annual revenue grew by 30% driven by cloud services.", "ec": "在云服务的推动下，年收入增长了30%。", "t": "biz", "d": "2026-07-13"}, {"w": "portfolio", "p": "/pɔːrtˈfolioʊ/", "mc": "n. 投资组合；作品集", "me": "a range of investments or products", "e": "The firm diversified its portfolio by entering the Asian market.", "ec": "该公司通过进入亚洲市场实现了业务组合多元化。", "t": "biz", "d": "2026-07-13"}, {"w": "scalable", "p": "/ˈskeɪləbl/", "mc": "adj. 可扩展的", "me": "able to be changed in size or scale", "e": "We need a scalable compliance solution that adapts to new regulations.", "ec": "我们需要一个可扩展的合规解决方案，以适应新的法规。", "t": "biz", "d": "2026-07-13"}, {"w": "subpoena", "p": "/səˈpiːnə/", "mc": "n. 传票", "me": "a writ ord
