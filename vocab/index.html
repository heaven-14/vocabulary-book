let currentTab = 'list';
let reviewIndex = 0;
let reviewQueue = [];
let showAnswer = false;

function speak(text) {
  const audio = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=1');
  audio.play();
}
// Global voices array - voices load asynchronously in most browsers
let availableVoices = [];
window.speechSynthesis.onvoiceschanged = () => {
  availableVoices = window.speechSynthesis.getVoices();
};

function speakSentence(word) {
  if (!word) return;
  // Find the example sentence for this word
  const w = WORDS.find(item => item.word === word);
  if (!w || !w.example) return;
  const text = w.example;
  // Use Web Speech API (built into all modern browsers)
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    utterance.pitch = 1;
    // Try to find a good English voice from cached voices
    const enVoice = availableVoices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) ||
                    availableVoices.find(v => v.lang.startsWith('en-US')) ||
                    availableVoices.find(v => v.lang.startsWith('en'));
    if (enVoice) utterance.voice = enVoice;
    window.speechSynthesis.speak(utterance);
  } else {
    alert('您的浏览器不支持语音合成功能，请使用Chrome、Safari或Edge浏览器');
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'list') || (i === 1 && tab === 'review'));
  });
  document.getElementById('listView').classList.toggle('hidden', tab !== 'list');
  document.getElementById('reviewView').classList.toggle('hidden', tab !== 'review');
  if (tab === 'review') startReview();
}

function tagLabel(tag) {
  const map = { bbc: 'BBC新闻', bbc2: 'BBC全球', law: '法律', biz: '商务', cbs: 'CBS新闻', general: '通用' };
  return '<span class="tag tag-' + tag + '">' + (map[tag] || tag) + '</span>';
}

function renderWords(filter = '') {
  const container = document.getElementById('listView');
  const filtered = WORDS.filter(w => 
    !filter || w.word.toLowerCase().includes(filter.toLowerCase()) ||
    w.meaning_cn.includes(filter) || (w.tag && w.tag.includes(filter.toLowerCase()))
  );
  
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">没有找到匹配的单词</div>';
    return;
  }
  
  container.innerHTML = filtered.map(w => `
    <div class="card">
      <div class="word-title">
        <span class="word-text">${w.word}</span>
        <span class="phonetic">${w.phonetic || ''}</span>
        <button class="speak-btn" onclick="speak('${w.word.replace(/'/g, "\\'")}')">🔊</button>
      </div>
      <div style="margin-bottom:4px">${tagLabel(w.tag || 'general')}</div>
      <div class="meaning">
        <div class="meaning-cn">${w.meaning_cn}</div>
        <div class="meaning-en">${w.meaning_en}</div>
      </div>
      ${w.example ? `
      <div class="example">
        <div class="example-en"><span>${w.example}</span><button class="example-speak-btn" onclick="speakSentence('${w.word.replace(/'/g, "\\'")}')">🔊</button></div>
        ${w.example_cn ? `<div class="example-cn">${w.example_cn}</div>` : ''}
      </div>` : ''}
      <div class="date-tag">添加于 ${w.added}</div>
    </div>
  `).join('');
  
  document.getElementById('stats').textContent = `共 ${WORDS.length} 个单词`;
}

function filterWords() {
  const q = document.getElementById('searchInput').value;
  renderWords(q);
}

function startReview() {
  reviewQueue = [...WORDS].sort(() => Math.random() - 0.5);
  reviewIndex = 0;
  showAnswer = false;
  renderReview();
}

function renderReview() {
  const section = document.getElementById('reviewSection');
  if (reviewQueue.length === 0) {
    section.innerHTML = '<div class="empty">暂无单词可复习</div>';
    return;
  }
  if (reviewIndex >= reviewQueue.length) {
    section.innerHTML = `
      <div class="review-card">
        <div style="font-size:1.3em;margin-bottom:10px">🎉 复习完成！</div>
        <div style="color:#888">共复习了 ${reviewQueue.length} 个单词</div>
        <button class="review-btn btn-next" onclick="startReview()" style="margin-top:15px">再来一轮</button>
      </div>`;
    return;
  }
  
  const w = reviewQueue[reviewIndex];
  section.innerHTML = `
    <div class="review-progress">${reviewIndex + 1} / ${reviewQueue.length}</div>
    <div class="review-card">
      <div class="review-word">${w.word}</div>
      <div class="review-phonetic">${w.phonetic || ''}</div>
      <button class="speak-btn" onclick="speak('${w.word.replace(/'/g, "\\'")}')" style="margin:0 auto">🔊</button>
      <div class="review-meaning ${showAnswer ? '' : 'hidden'}">
        <div style="margin-bottom:6px">${tagLabel(w.tag || 'general')}</div>
        <div class="meaning-cn" style="font-size:1.1em;margin-bottom:6px">${w.meaning_cn}</div>
        <div class="meaning-en">${w.meaning_en}</div>
        ${w.example ? `<div class="example" style="margin-top:12px">
          <div class="example-en"><span>${w.example}</span><button class="example-speak-btn" onclick="speakSentence('${w.word.replace(/'/g, "\\'")}')">🔊</button></div>
          ${w.example_cn ? `<div class="example-cn">${w.example_cn}</div>` : ''}
        </div>` : ''}
      </div>
      <div class="review-actions">
        ${!showAnswer 
          ? '<button class="review-btn btn-show" onclick="revealAnswer()">显示答案</button>'
          : '<button class="review-btn btn-hard" onclick="nextReview()">还没记住</button><button class="review-btn btn-easy" onclick="nextReview()">记住了</button>'
        }
      </div>
    </div>`;
}

function revealAnswer() { showAnswer = true; renderReview(); }
function nextReview() { reviewIndex++; showAnswer = false; renderReview(); }

renderWords();
</script>

  speechSynthesis.onvoiceschanged = function() { speechSynthesis.getVoices(); };
  speechSynthesis.getVoices();
}
</script>
